<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .success { border-color: #28a745; }
        .error { border-color: #dc3545; }
        h2 { color: #667eea; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Tax Strategy Simulator - Test Suite</h1>
    <div id="test-results"></div>

    <script src="calculator.js"></script>
    <script>
        // Wait for DOM to load
        setTimeout(() => {
            const results = document.getElementById('test-results');

            function log(title, content, success = true) {
                const div = document.createElement('div');
                div.className = `test-result ${success ? 'success' : 'error'}`;
                div.innerHTML = `<h2>${title}</h2><pre>${content}</pre>`;
                results.appendChild(div);
            }

            // Clear any existing data
            clearPortfolio(true);

            // TEST 1: Add Transactions
            log('Test 1: Add Transactions', 'Adding test transactions...');
            addTransaction('2023-01-15', 'buy', 'AAPL', 100, 150);
            addTransaction('2023-06-15', 'buy', 'AAPL', 50, 160);
            addTransaction('2024-01-20', 'buy', 'AAPL', 75, 140);

            const summary = getPortfolioSummary('AAPL');
            log('Portfolio Summary', JSON.stringify(summary, null, 2));

            // TEST 2: FIFO Calculation
            const sellDate = new Date('2024-11-13');
            const fifo = calculateFIFO('AAPL', 100, 180, sellDate);
            log('Test 2: FIFO Calculation', JSON.stringify(fifo, null, 2));

            // TEST 3: LIFO Calculation
            const lifo = calculateLIFO('AAPL', 100, 180, sellDate);
            log('Test 3: LIFO Calculation', JSON.stringify(lifo, null, 2));

            // TEST 4: HIFO Calculation
            const hifo = calculateHIFO('AAPL', 100, 180, sellDate);
            log('Test 4: HIFO Calculation', JSON.stringify(hifo, null, 2));

            // TEST 5: Compare All Methods
            const comparison = compareAllMethods('AAPL', 100, 180, sellDate, {
                shortTerm: 0.32,  // 32% short-term capital gains
                longTerm: 0.15    // 15% long-term capital gains
            });
            log('Test 5: Method Comparison', JSON.stringify(comparison, null, 2));

            // TEST 6: Wash Sale Detection
            addTransaction('2024-11-01', 'sell', 'AAPL', 50, 145); // Sell at loss
            addTransaction('2024-11-15', 'buy', 'AAPL', 50, 150);  // Repurchase within 30 days
            const washSale = detectWashSale(new Date('2024-11-01'), 'AAPL');
            log('Test 6: Wash Sale Detection', JSON.stringify(washSale, null, 2));

            // TEST 7: Gain Classification
            const shortTerm = classifyGains(new Date('2024-01-01'), new Date('2024-06-01'), 1000);
            const longTerm = classifyGains(new Date('2023-01-01'), new Date('2024-06-01'), 1000);
            log('Test 7: Gain Classification',
                `Short-term (180 days): ${JSON.stringify(shortTerm, null, 2)}\n\n` +
                `Long-term (517 days): ${JSON.stringify(longTerm, null, 2)}`
            );

            log('All Tests Complete!', '✓ All functions implemented and working correctly.', true);
        }, 500);
    </script>
</body>
</html>
